name: investors
# משיכת דוחות 13F פעם ביום (הדוחות רבעוניים, אין טעם לרוץ כל 10 דקות). אפשר גם ידנית: Actions > investors > Run workflow
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: investors
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node 13f.mjs
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          OPENFIGI_KEY: ${{ secrets.OPENFIGI_KEY }}
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add investors.json figi-cache.json
          git diff --cached --quiet || (git commit -m "update investors" && git pull --rebase -q && git push)
