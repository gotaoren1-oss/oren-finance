.sess[data-s=open]{--c:#34d399}.sess[data-s=pre]{--c:#fbbf24}.sess[data-s=post]{--c:#8fa6c4}.sess[data-s=closed]{--c:#8c97b2}

.rg{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));margin:8px 0 18px}.rl{padding:11px 14px;border-radius:13px;border:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}.rl.t{border-color:#34d39966;background:#34d39912}.rl.n{border-style:dashed;opacity:.65}
.sg .spk{width:100%;height:48px;margin:10px 0}.spk path{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.8s .2s forwards}@keyframes dr{to{stroke-dashoffset:0}}
.ck{display:flex;gap:8px;font-size:13.5px;padding:2px 0;color:var(--mut)}.ck span{width:16px;color:var(--dn)}.ck.y{color:var(--tx)}.ck.y span{color:var(--up)}

nav{flex-wrap:wrap}

.fi{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-top:1px solid var(--bd)}.fi:first-child{border:0}.fi a{border:0!important;flex:1}.fi small{white-space:nowrap;font-size:12px}

.card::before{pointer-events:none}.mt{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:10px}.mtl{display:block;text-decoration:none;color:var(--tx);padding:10px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);transition:.25s}.mtl:hover{border-color:rgba(255,255,255,.26);transform:translateY(-2px)}.mtl span{display:block;font-size:12px;color:var(--mut)}.mtl b{font-size:22px}.mtl small{display:block;font-size:12.5px}.tick{direction:ltr;justify-content:flex-end}.tick div{direction:ltr}.tabs{flex-wrap:wrap}.card.rv.on{opacity:1}

const gauge=(n,pct,c,t,s,i=0)=>`<div class="card gauge rv" style="--i:${i}"><div class="gw"><svg viewBox="0 0 120 120"><circle class="t" cx="60" cy="60" r="52"/><circle class="v" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7" data-s="${pct}" style="stroke:${c};color:${c}"/></svg><div class="n" data-n="${n}">0</div></div><b style="font-size:19px">${t}</b><span class="mut" style="font-size:13px">${s}</span></div>`;

const TONE={up:'var(--up)',am:'var(--am)',dn:'var(--dn)'};
function macroTiles(d){const m=d.macro;if(!m?.items?.length)return'';return`<b style="display:block;margin-top:18px">הדוחות הכלכליים האחרונים · ארה"ב</b><div class="mt">${m.items.map(x=>`<a class="mtl" href="#macro"><span>${esc(x.name)}</span><b class="num">${esc(x.value)}</b><small style="color:${TONE[x.tone]}">${esc(x.status)}</small></a>`).join('')}</div>`}
function macroV(d){const m=d.macro;if(!m?.items?.length)return'';
  return H('macro','מצב הדוחות הכלכליים האחרונים בארה"ב','מתעדכן אוטומטית מ-FRED (הפדרל ריזרב של סנט לואיס). הסטטוס והמשמעות נקבעים בכללים קבועים ולא במודל, וזה לא המלצת השקעה')+`<div class="grid">${m.items.map((x,i)=>`<div class="card rv" style="--i:${i%6}"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>${esc(x.name)}</b><span class="chip" style="color:${TONE[x.tone]};border-color:${TONE[x.tone]}">${esc(x.status)}</span></div><div class="num" style="font-size:30px;font-weight:700;margin:6px 0 2px">${esc(x.value)}</div><div class="mut" style="font-size:13px">${esc(x.detail)} · נתון ל-${esc(x.asOf)}</div><span class="lbl">מה זה</span><span style="font-size:14.5px">${esc(x.what)}</span><span class="lbl">מה המשמעות עכשיו</span><span style="font-size:14.5px">${esc(x.impact)}</span></div>`).join('')}</div></section>`}

let CID=0;const cc=x=>x==null||isNaN(x)||x>=0?'var(--up)':'var(--dn)';
function areaSvg(v,o={}){v=(v||[]).filter(x=>x!=null&&!isNaN(x));if(v.length<3)return'';const mini=o.mini,w=mini?100:600,hh=mini?44:(o.h||210),color=o.color||'var(--up)',id='g'+(++CID);let mn=Math.min(...v),mx=Math.max(...v);const sp=mx-mn||1;for(const L of o.lines||[])if(L.v>mn-sp*.7&&L.v<mx+sp*.7){mn=Math.min(mn,L.v);mx=Math.max(mx,L.v)}const pd=(mx-mn)*.08||1;mn-=pd;mx+=pd;
  const Lm=mini?0:50,T=mini?3:10,Bm=mini?3:18,Rm=mini?0:8,X=i=>Lm+(w-Lm-Rm)*i/(v.length-1),Y=x=>T+(hh-T-Bm)*(1-(x-mn)/(mx-mn)),pts=v.map((x,i)=>X(i).toFixed(1)+','+Y(x).toFixed(1)),line='M'+pts.join('L'),area=line+`L${X(v.length-1)},${hh-Bm}L${X(0)},${hh-Bm}Z`;
  let g='';if(!mini){for(let k=0;k<=3;k++){const val=mn+(mx-mn)*k/3,y=Y(val);g+=`<line x1="${Lm}" x2="${w-Rm}" y1="${y}" y2="${y}" stroke="var(--bd)" stroke-width="1"/><text x="${Lm-6}" y="${y+3.5}" text-anchor="end">${val>=1000?Math.round(val).toLocaleString('en-US'):val.toFixed(val<10?2:1)}</text>`}}
  const ls=(o.lines||[]).filter(L=>L.v>=mn&&L.v<=mx).map(L=>`<line x1="${Lm}" x2="${w-Rm}" y1="${Y(L.v)}" y2="${Y(L.v)}" stroke="${L.c}" stroke-width="1.4" stroke-dasharray="5 4"/>${mini?'':`<text x="${w-Rm-2}" y="${Y(L.v)-4}" text-anchor="end" style="fill:${L.c}">${esc(L.n)}</text>`}`).join('');
  const lx=X(v.length-1),ly=Y(v.at(-1));
  return`<svg class="${mini?'':'chart'}" viewBox="0 0 ${w} ${hh}"${mini?' preserveAspectRatio="none"':''}><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity="${mini?.28:.3}"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${g}<path d="${area}" fill="url(#${id})"/>${ls}<path d="${line}" fill="none" stroke="${color}" stroke-width="${mini?1.8:2.4}" stroke-linejoin="round" stroke-linecap="round"${mini?' vector-effect="non-scaling-stroke"':''} pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.6s .15s forwards"/>${mini?'':`<circle cx="${lx}" cy="${ly}" r="4.5" fill="${color}"/><circle cx="${lx}" cy="${ly}" r="9" fill="${color}" opacity=".18"/>`}</svg>`}
function multiSvg(ser){ser=ser.filter(s=>s.v&&s.v.length>5);if(!ser.length)return'';const w=600,hh=210,Lm=50,T=10,Bm=18,Rm=8,N=ser.map(s=>s.v.map(x=>x/s.v[0]*100)),all=N.flat(),mn0=Math.min(...all),mx0=Math.max(...all),pd=(mx0-mn0)*.08||1,mn=mn0-pd,mx=mx0+pd,Y=x=>T+(hh-T-Bm)*(1-(x-mn)/(mx-mn));let g='';for(let k=0;k<=3;k++){const val=mn+(mx-mn)*k/3;g+=`<line x1="${Lm}" x2="${w-Rm}" y1="${Y(val)}" y2="${Y(val)}" stroke="var(--bd)"/><text x="${Lm-6}" y="${Y(val)+3.5}" text-anchor="end">${val.toFixed(0)}</text>`}
  g+=`<line x1="${Lm}" x2="${w-Rm}" y1="${Y(100)}" y2="${Y(100)}" stroke="var(--mut)" stroke-dasharray="3 4" opacity=".6"/>`;
  return`<svg class="chart" viewBox="0 0 ${w} ${hh}">${g}${N.map((v,i)=>`<path d="M${v.map((x,j)=>(Lm+(w-Lm-Rm)*j/(v.length-1)).toFixed(1)+','+Y(x).toFixed(1)).join('L')}" fill="none" stroke="${ser[i].c}" stroke-width="2.2" stroke-linejoin="round" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.6s ${i*.15}s forwards"/>`).join('')}</svg><div class="lgd">${ser.map((s,i)=>`<span><i style="background:${s.c}"></i>${esc(s.n)} ${sgn(N[i].at(-1)-100)}</span>`).join('')}</div>`}
function donut(parts){const t=parts.reduce((a,x)=>a+x.v,0)||1,r=52,C=2*Math.PI*r;let off=0;return`<svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--bd)" stroke-width="16"/>${parts.map(x=>{const l=x.v/t*C,s=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${x.c}" stroke-width="16" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=l;return s}).join('')}<text x="70" y="68" text-anchor="middle" style="font:800 26px Inter;fill:var(--tx)">${t}</text><text x="70" y="86" text-anchor="middle" style="font:600 10px Inter;fill:var(--mut)">נכסים</text></svg>`}
function pulseV(d){const S=d.signals||{};if(!S.SPY)return'';const names={SPY:'S&P 500',QQQ:'NASDAQ 100','^VIX':'VIX','BTC-USD':'BTC','ETH-USD':'ETH'},card=k=>{const v=S[k];if(!v)return'';const c=k==='^VIX'?(v.chg>=0?'var(--dn)':'var(--up)'):cc(v.chg);return`<div class="pc rv"><b>${names[k]}</b><div class="p" ${NM[k]?`data-live="${k}"`:''}>${n2(v.price)}</div><span class="c" style="color:${cc(v.chg)}">${v.chg>=0?'▲':'▼'} ${Math.abs(v.chg).toFixed(2)}%</span>${areaSvg(v.spark,{mini:1,color:c})}</div>`},s=S.SPY,ln=[];if(s.e50)ln.push({v:s.e50,c:'#e3b341',n:'EMA 50'});if(s.e150)ln.push({v:s.e150,c:'#7a8cff',n:'EMA 150'});
  return H('markets','השווקים עכשיו','60 ימי המסחר האחרונים. הקווים המקווקווים הם ממוצעים נעים (EMA) לפי האסטרטגיה שלך')+`<div class="pulse">${['SPY','QQQ','^VIX','BTC-USD','ETH-USD'].map(card).join('')}</div><div class="grid" style="margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))"><div class="card rv"><b>S&P 500</b> <span class="mut num" style="font-size:13px">${n2(s.price)} · EMA 50 ${n2(s.e50)} · EMA 150 ${n2(s.e150)}</span>${areaSvg(s.spark,{color:cc(s.spark.at(-1)-s.spark[0]),lines:ln})}</div><div class="card rv" style="--i:2"><b>ביצועים יחסיים (100 = תחילת התקופה)</b>${multiSvg([{v:S.SPY.spark,n:'S&P 500',c:'#7fa89a'},{v:S.QQQ?.spark,n:'NASDAQ 100',c:'#4a82c4'},{v:S['BTC-USD']?.spark,n:'BTC',c:'#e3a23b'},{v:S.NVDA?.spark,n:'NVDA',c:'#35d08a'}])}</div></div></section>`}
function hero(d){const a=d.analysis,p=d.prices||{},mo=a?.mood||{},sc=Number.isFinite(+mo.score)?+mo.score:50;
  return`<div class="hero"><div class="card rv"><span class="chip">תמונת מצב מ-${esc(new Date(d.updated).toLocaleString('he-IL',{timeZone:'America/New_York',dateStyle:'short',timeStyle:'short'}))} ET</span><h1>לאן השוק הולך</h1>${a?`<p style="font-size:17px">${esc(a.summary)}</p>`:`<p class="mut">אין תמונת מצב זמינה כרגע. הכללים הטכניים והבקרה מוצגים למטה.</p>`}${macroTiles(d)}</div>${a?gauge(sc,sc,col(sc),esc(mo.label||'מצב השוק'),'',2):''}</div>`}

function regime(d){const m=d.market;if(!m)return'';const mk=(r,t,f)=>`<div class="rl ${r.state===true?'t':r.state==null?'n':''}"><span>${esc(r.label)}</span><b class="${r.state==null?'mut':r.state?t:f}">${r.state==null?'לא זמין':r.state?'כן':'לא'}${r.value!=null&&r.state!=null?' · '+esc(r.value):''}</b></div>`,R=m.risk;
  return H('regime','מצב השוק לפי הכללים שלך','אותות קניית דיפים ומגמה. מחירים נכון לסגירה האחרונה ב-'+esc(m.date))+`<div class="hero"><div class="card rv"><b>כללי קניית דיפים · ${m.dip} מתוך 4 פעילים</b><div class="rg">${m.rules.map(r=>mk(r,'am','mut')).join('')}</div><b>מגמה</b><div class="rg" style="margin-bottom:0">${m.trend.map(r=>mk(r,'up','dn')).join('')}</div>${m.conflict?'<p class="am" style="margin:14px 0 0">⚠ סתירה בין הכללים: יש אות דיפ, אבל S&P 500 מתחת ל-EMA 150. כלל המגמה וכלל הדיפים לא מסכימים, והבחירה שלך.</p>':''}<p class="mut" style="margin:12px 0 0;font-size:13px">פחד וחמדנות (CNN): ${m.fng?esc(m.fng.value)+' · '+esc(m.fng.label):'לא זמין'} · קריפטו: ${m.cfng?esc(m.cfng.value)+' · '+esc(m.cfng.label):'לא זמין'}. S5FI ו-McClellan מסומנים "לא זמין" כי אין להם מקור חינמי יציב.</p></div>${gauge(R,R*10,col(100-R*10),'רמת סיכון כללית','מתוך 10, מחושב מ-VIX ומגמת השוק',2)}</div></section>`}

const met=(l,v,c='')=>`<div class="met"><span>${l}</span><b class="num ${c}">${v}</b></div>`;
function controlV(d){const c=d.control;if(!c)return'';const o=(c.open||[])[0],st=c.stats||{n:0,wins:0,avgPnl:0,avgAlpha:0};
  const open=o?`<div class="card rv"><span class="chip">עסקת מעקב פעילה (היפותטית, ללא כסף אמיתי)</span><h3 class="num" style="margin:8px 0 2px;font-size:32px">${esc(o.ticker)} <small class="${cls(o.pnl)}" style="font-size:20px">${sgn(o.pnl)}</small></h3><p class="mut" style="margin:0 0 12px">${esc(o.thesis||'')}</p><div class="mg">${met('כניסה',n2(o.entry)+' · '+esc(o.date))}${met('עכשיו',n2(o.now))}${met('מול S&P 500',sgn(o.alpha),cls(o.alpha))}${met('Stop (ATR×2)',n2(o.stop),'dn')}${met('יעד 2R',n2(o.target),'up')}${met('ציון כניסה',esc(o.entryScore)+'/100')}</div>${(()=>{const sp=d.signals?.[o.ticker]?.spark;return sp?areaSvg(sp,{color:cc(o.pnl),lines:[{v:o.entry,c:"#8da197",n:"כניסה"},{v:o.stop,c:"#ff6b62",n:"Stop"},{v:o.target,c:"#35d08a",n:"יעד"}]}):""})()}<span class="lbl">יום ${esc(o.days)} מתוך 60</span><div class="bar"><i style="width:${Math.min(100,(o.days||0)/60*100)}%"></i></div></div>`:`<div class="card rv"><b>אין כרגע עסקת מעקב</b><p class="mut">עסקה נפתחת אוטומטית כשיש מניה שעומדת בשני המודלים הטכניים.</p></div>`;
  const stats=`<div class="card rv" style="--i:2"><b>סטטיסטיקת הבקרה</b><div class="mg" style="margin-top:12px">${met('עסקאות שנסגרו',st.n)}${met('הצלחות',st.n?Math.round(st.wins/st.n*100)+'%':'–')}${met('תשואה ממוצעת',st.n?sgn(st.avgPnl):'–',cls(st.avgPnl))}${met('עודף על S&P',st.n?sgn(st.avgAlpha):'–',cls(st.avgAlpha))}</div><p class="mut" style="font-size:13px;margin:12px 0 0">יציאה: פגיעה ב-Stop, השגת יעד 2R, שבירת EMA 150 או 60 יום. בכל סגירה נוצר דוח חקירה לאחור. התוצאה האחרונה נשמרת כאן עד שמעקב חדש נסגר.</p></div>`;
  const cl=(c.closed||[]).slice(0,1).map(x=>{const L=x.lesson||{};return`<div class="card rv"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div><b class="num" style="font-size:20px">${esc(x.ticker)}</b> <span class="chip" style="color:${x.outcome==='הצלחה'?'var(--up)':'var(--dn)'};border-color:currentColor">${esc(x.outcome)}</span> <span class="num ${cls(x.pnl)}">${sgn(x.pnl)}</span> <small class="mut">מול S&P: ${sgn(x.alpha)}</small></div><small class="mut">${esc(x.date)} ← ${esc(x.exit)} · ${esc(x.why)}</small></div>${L.summary?`<p style="margin:10px 0 0;font-size:14.5px">${esc(L.summary)}</p>`:''}${L.lesson?`<span class="lbl">לקח</span>${esc(L.lesson)}`:''}${L.change?`<span class="lbl">שינוי מוצע בכללים</span>${esc(L.change)}`:''}</div>`}).join('');
  return H('control','בקרה: האם הכללים באמת עובדים','המערכת עוקבת לבד אחרי מניה אחת מהסריקה, עד 60 יום, כאילו הושקע בה כסף. בסיום נרשמת התוצאה, והיא נשארת עד שהמעקב הבא נסגר')+`<div class="grid">${open}${stats}</div>${cl?`<div class="grid" style="margin-top:16px">${cl}</div>`:''}</section>`}

function sgrid(d,f){const tt=[...(d.news||[]),...(d.yt||[])].map(x=>x.title||'');
  const s=Object.entries(d.signals||{}).filter(([k,v])=>k!='^VIX'&&(f==='all'||v.verdict===f)).sort((a,b)=>b[1].combined-a[1].combined);
  if(!s.length)return'<p class="mut">אין נכסים בקטגוריה הזו.</p>';
  return s.map(([k,v],i)=>{const t=NM[k]||k,re=new RegExp((t.length<=2?'\\$':'(^|[^A-Za-z])\\$?')+t.replace(/[-.]/g,'\\$&')+'(?![A-Za-z])'),men=tt.filter(x=>re.test(x)).length,sp=v.spark||[],mn=Math.min(...sp),mx=Math.max(...sp),vc=VC[v.verdict]||'var(--mut)',
    pts=sp.map((y,j)=>`${j?'L':'M'}${(j/(sp.length-1||1)*200).toFixed(1)} ${(44-(y-mn)/(mx-mn||1)*40).toFixed(1)}`).join(' '),
    lst=(L,o)=>L.map(([c,l])=>`<div class="ck ${o[c]?'y':''}"><span>${o[c]==null?'–':o[c]?'✓':'✗'}</span>${l}</div>`).join('');
    return`<div class="card sg rv on"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><b class="num" style="font-size:22px">${esc(t)}</b> <span class="num">${n2(v.price)}</span> <small class="${cls(v.chg)}">${sgn(v.chg)}</small></div><span class="chip" style="color:${vc};border-color:${vc}">${esc(v.verdict)} · ${esc(v.combined)}</span></div>
<svg class="spk" viewBox="0 0 200 48" preserveAspectRatio="none"><path d="${pts}" pathLength="1" fill="none" stroke="${vc}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><div class="bar" style="margin:0 0 10px"><i style="width:${Math.max(0,Math.min(100,v.combined))}%"></i></div>
<div class="two"><div><span class="lbl" style="margin:0 0 4px">מודל א׳ · האסטרטגיה שלך</span>${lst(CKA,v.checks||{})}</div><div><span class="lbl" style="margin:0 0 4px">מודל ב׳ · FALILO FINANCE</span>${lst(CKB,v.ours||{})}</div></div>
<div class="mut" style="font-size:13px;margin-top:8px">RSI ${Math.round(v.rsi)} · EMA 150: ${n2(v.e150)} · Stop (ATR×2): <b class="dn">${n2(v.stop)}</b> (‎-${n2(v.stopPct)}%) · נתונים מ-${esc(v.date)}</div>
<div style="margin-top:8px">${men?`<span class="chip">מוזכר ${men} פעמים במקורות</span>`:''}${v.fib?.inFib?'<span class="chip">באזור פיבונאצ׳י 50–61.8%</span>':''}${v.reds?'<span class="chip">3 ימים אדומים</span>':''}</div></div>`}).join('')}
function signalsV(d){const all=Object.entries(d.signals||{}).filter(([k])=>k!='^VIX');if(!all.length)return'';const c=v=>all.filter(([,x])=>x.verdict===v).length;
  return H('signals','סורק הכללים הטכניים',`${all.length} נכסים נבדקו בשני מודלים, ללא הגבלה מלאכותית. זה חישוב מתמטי ולא המלצת קנייה`)+`<div class="tabs" id="sf"><button class="a" data-f="all">הכל (${all.length})</button>${['חזק','חיובי','ניטרלי','חלש'].map(v=>`<button data-f="${v}">${v} (${c(v)})</button>`).join('')}</div><div class="grid" id="sg">${sgrid(d,'all')}</div></section>`}

// שכבה חיה: מחירי BTC ו-ETH מתעדכנים בדפדפן כל 15 שניות (Binance, גיבוי Coinbase), בלי תלות בהרצה האוטומטית
const LIVE={};async function liveCrypto(){try{const r=await fetch('https://api.binance.com/api/v3/ticker/24hr?symbols=%5B%22BTCUSDT%22,%22ETHUSDT%22%5D',{cache:'no-store'});if(!r.ok)throw 0;for(const x of await r.json())LIVE[x.symbol.slice(0,3)+'-USD']={p:+x.lastPrice,ch:+x.priceChangePercent,t:Date.now()}}catch{try{for(const s of['BTC','ETH']){const j=await(await fetch(`https://api.coinbase.com/v2/prices/${s}-USD/spot`,{cache:'no-store'})).json();LIVE[s+'-USD']={p:+j.data.amount,ch:null,t:Date.now()}}}catch{return}}
 document.querySelectorAll('[data-live]').forEach(e=>{const l=LIVE[e.dataset.live];if(l)e.textContent='\u200e$'+l.p.toLocaleString('en-US',{maximumFractionDigits:l.p>100?0:2})});if(D)tape(D)}
liveCrypto();setInterval(liveCrypto,15000);
document.getElementById('tg').onclick=()=>{const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('ft',n)}catch{}if(tvDone)tvLoad()};
document.getElementById('rb').onclick=async e=>{const b=e.currentTarget;b.classList.add('spin');await Promise.all([load(true),liveCrypto()]);setTimeout(()=>b.classList.remove('spin'),700)};
load();setInterval(load,30000);document.addEventListener('visibilitychange',()=>!document.hidden&&load());
</script>
</body>
