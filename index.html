<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oren Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--card:rgba(255,255,255,.045);--bd:rgba(255,255,255,.09);--tx:#eef2ff;--mut:#8c97b2;--g1:#7c5cff;--g2:#22d3ee;--g3:#34d399;--up:#34d399;--dn:#fb7185;--am:#fbbf24}
@media(prefers-color-scheme:light){:root{--bg:#f3f5fb;--card:rgba(255,255,255,.75);--bd:rgba(20,30,70,.1);--tx:#111936;--mut:#5d6785}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Heebo,system-ui,Arial,sans-serif;overflow-x:hidden}
.aur{position:fixed;inset:0;z-index:-1;overflow:hidden}.aur i{position:absolute;width:55vw;height:55vw;border-radius:50%;filter:blur(90px);opacity:.38;animation:fl 22s ease-in-out infinite alternate}
.aur i:nth-child(1){background:var(--g1);top:-15%;right:-10%}.aur i:nth-child(2){background:var(--g2);bottom:-20%;left:-10%;animation-delay:-8s}.aur i:nth-child(3){background:var(--g3);top:35%;left:35%;width:30vw;height:30vw;opacity:.18;animation-delay:-14s}
@keyframes fl{to{transform:translate(6vw,5vh) scale(1.15)}}
nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:12px clamp(14px,4vw,40px);backdrop-filter:blur(18px);background:color-mix(in srgb,var(--bg) 55%,transparent);border-bottom:1px solid var(--bd)}
.logo{font:700 20px 'Space Grotesk',sans-serif;display:flex;align-items:center;gap:9px;letter-spacing:-.3px}
.logo b{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--g1),var(--g2));display:grid;place-items:center;color:#fff;font-size:15px;box-shadow:0 0 22px #7c5cff88}
.logo span{background:linear-gradient(90deg,var(--tx),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
nav a{color:var(--mut);text-decoration:none;font-size:14px;transition:.25s}nav a:hover{color:var(--tx)}.sp{flex:1}
.live{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:7px;white-space:nowrap}.live i{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 #34d39988;animation:pu 2s infinite}
@keyframes pu{70%{box-shadow:0 0 0 9px #34d39900}}
main{max-width:1180px;margin:auto;padding:28px clamp(14px,4vw,40px) 90px}
section{margin-top:54px}h2{font:800 26px Heebo;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 20px;font-size:14.5px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;backdrop-filter:blur(14px);transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),#7c5cff22,transparent 60%);opacity:0;transition:.3s}.card:hover{transform:translateY(-4px);border-color:#7c5cff66}.card:hover::before{opacity:1}
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i,0)*70ms)}.rv.on{opacity:1;transform:none}
.hero{display:grid;gap:22px;grid-template-columns:1.6fr 1fr;align-items:stretch}@media(max-width:820px){.hero{grid-template-columns:1fr}}
.hero h1{font:800 clamp(30px,5vw,50px)/1.1 Heebo;margin:0 0 14px;background:linear-gradient(100deg,var(--tx) 20%,var(--g2) 60%,var(--g1));-webkit-background-clip:text;background-clip:text;color:transparent}
.gauge{display:grid;place-items:center;text-align:center}.gauge svg{width:170px;height:170px;transform:rotate(-90deg)}
.gauge circle{fill:none;stroke-width:11;stroke-linecap:round}.gauge .t{stroke:var(--bd)}.gauge .v{transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1),stroke 1s;filter:drop-shadow(0 0 8px currentColor)}
.gauge .n{position:absolute;font:700 40px 'Space Grotesk'}.gw{position:relative;display:grid;place-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;font-size:12.5px;border:1px solid var(--bd);background:var(--card);margin:2px 0 2px 5px}
.up{color:var(--up)}.dn{color:var(--dn)}.am{color:var(--am)}.mut{color:var(--mut)}.num{font-family:'Space Grotesk',sans-serif}
.tick{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}.tick div{padding:10px 16px;border-radius:14px;border:1px solid var(--bd);background:var(--card)}.tick b{font:700 21px 'Space Grotesk'}
.pk h3{margin:0;font:700 24px 'Space Grotesk'}.pk small{color:var(--mut)}.pk p{margin:10px 0 0;font-size:14.5px}.lbl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-top:12px;display:block}
.bar{height:6px;border-radius:9px;background:var(--bd);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--g1),var(--g2));width:0;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.sec{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;padding:9px 0}.sec .tr{position:relative;height:10px;border-radius:9px;background:var(--bd)}.sec .tr:after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--mut);opacity:.5}
.sec .tr i{position:absolute;top:0;bottom:0;border-radius:9px;width:0;transition:width 1.3s cubic-bezier(.2,.8,.2,1)}.sec small{grid-column:2;color:var(--mut);margin-top:-6px;font-size:12.5px}
.rk{display:flex;gap:12px}.lv{flex:none;width:12px;border-radius:9px}.tl{position:relative;padding-inline-start:26px}.tl:before{content:"";position:absolute;inset-inline-start:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--g1),var(--g2));opacity:.5}
.tl .e{position:relative;margin-bottom:14px}.tl .e:before{content:"";position:absolute;inset-inline-start:-24px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--g2);box-shadow:0 0 12px var(--g2)}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{font:inherit;font-size:14px;color:var(--mut);background:var(--card);border:1px solid var(--bd);padding:7px 18px;border-radius:99px;cursor:pointer;transition:.25s}.tabs button.a{color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent}
.feed a{display:block;color:var(--tx);text-decoration:none;padding:11px 0;border-top:1px solid var(--bd);transition:.2s}.feed a:hover{color:var(--g2);padding-inline-start:8px}.feed a:first-child{border:0}
.sk{height:120px;border-radius:20px;background:linear-gradient(90deg,var(--card),#ffffff14,var(--card));background-size:200% 100%;animation:sh 1.4s infinite}@keyframes sh{to{background-position:-200% 0}}
footer{position:fixed;bottom:0;inset-inline:0;text-align:center;font-size:12px;color:var(--mut);padding:8px 14px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--bd);z-index:15}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
.clock{text-align:center;line-height:1.15}.ny{font:700 25px 'Space Grotesk';letter-spacing:1px;font-variant-numeric:tabular-nums;direction:ltr}.clock small{font-size:11px;color:var(--mut)}
.sess{display:flex;align-items:center;gap:9px;padding:7px 15px;border-radius:99px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);font-size:13.5px;transition:.6s}.sess i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}.sess small{color:var(--mut);font-variant-numeric:tabular-nums}
.sess[data-s=open]{--c:#34d399}.sess[data-s=pre]{--c:#fbbf24}.sess[data-s=post]{--c:#22d3ee}.sess[data-s=closed]{--c:#8c97b2}
.tape{direction:ltr;overflow:hidden;border-bottom:1px solid var(--bd);font:500 13px 'Space Grotesk';white-space:nowrap;background:color-mix(in srgb,var(--bg) 60%,transparent)}.tape div{display:inline-block;padding:8px 0;animation:tp 70s linear infinite}.tape:hover div{animation-play-state:paused}.tape span{margin:0 22px}@keyframes tp{to{transform:translateX(-50%)}}
.warn{padding:9px 16px;text-align:center;font-size:14px}.warn.bad{background:#fb718526;color:var(--dn)}.warn.mid{background:#fbbf2420;color:var(--am)}
.rg{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));margin:8px 0 18px}.rl{padding:11px 14px;border-radius:13px;border:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}.rl.t{border-color:#34d39966;background:#34d39912}.rl.n{border-style:dashed;opacity:.65}
.sg .spk{width:100%;height:48px;margin:10px 0}.spk path{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.8s .2s forwards}@keyframes dr{to{stroke-dashoffset:0}}
.ck{display:flex;gap:8px;font-size:13.5px;padding:2px 0;color:var(--mut)}.ck span{width:16px;color:var(--dn)}.ck.y{color:var(--tx)}.ck.y span{color:var(--up)}
.hl{display:flex;gap:9px;align-items:center;font-size:13.5px;padding:5px 0;flex-wrap:wrap}.hl i{width:9px;height:9px;border-radius:50%;flex:none}
nav{flex-wrap:wrap}
.mg{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.met{padding:9px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card)}.met span{display:block;font-size:12px;color:var(--mut)}.met b{font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:420px){.two{grid-template-columns:1fr}}
.seg{display:flex;height:14px;border-radius:9px;overflow:hidden;background:var(--bd);margin-top:12px}.seg i{display:block;height:100%}
.fi{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-top:1px solid var(--bd)}.fi:first-child{border:0}.fi a{border:0!important;flex:1}.fi small{white-space:nowrap;font-size:12px}
.card::before{pointer-events:none}.mt{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:10px}.mtl{display:block;text-decoration:none;color:var(--tx);padding:10px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);transition:.25s}.mtl:hover{border-color:#7c5cff66;transform:translateY(-2px)}.mtl span{display:block;font-size:12px;color:var(--mut)}.mtl b{font-size:22px}.mtl small{display:block;font-size:12.5px}.tick{direction:ltr;justify-content:flex-end}.tick div{direction:ltr}.tabs{flex-wrap:wrap}.card.rv.on{opacity:1}
</style>
</head>
<body>
<div class="aur"><i></i><i></i><i></i></div>
<nav><div class="logo"><b>O</b><span>Oren Finance</span></div><a href="#macro">מאקרו</a><a href="#regime">מצב השוק</a><a href="#control">בקרה</a><a href="#signals">סורק</a><a href="#picks">מקורות</a><a href="#risks">סיכונים</a><a href="#earn">דוחות</a><a href="#crypto">קריפטו</a><a href="#behind">מאחורי הקלעים</a><div class="sp"></div><div class="clock"><div class="ny" id="ny">--:--:--</div><small id="nyd"></small></div><div class="sess" id="sess" data-s="closed"><i></i><b id="sl"></b><small id="sc"></small></div><div class="live"><i></i><span id="upd">טוען…</span></div></nav>
<div class="tape"><div id="tape"></div></div><div id="warn"></div>
<main id="m"><div class="sk"></div></main>
<footer>כלי מחקר המבוסס על מקורות חיצוניים ולא ייעוץ השקעות. ניתוח אוטומטי עלול לטעות, ויש לבדוק בעצמך לפני כל החלטה.</footer>
<script>
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>{try{return new Date(d).toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'})}catch{return''}};
const lk=(u,t)=>`<a${/^https?:\/\//.test(u||'')?` href="${esc(u)}" target="_blank" rel="noopener"`:''}>${esc(t)}</a>`;
const col=s=>`hsl(${Math.max(0,Math.min(100,s))*1.3} 85% 58%)`;
const sgn=(x,u='%')=>x==null||isNaN(x)?'–':(x>0?'+':'')+(+x).toFixed(1)+u,cls=x=>x==null||isNaN(x)?'mut':x>=0?'up':'dn',n2=x=>x==null||isNaN(x)?'–':(+x).toFixed(2);
const age=h=>h==null?'':h<1?'עכשיו':h<48?`לפני ${h} ש׳`:`לפני ${Math.round(h/24)} ימים`;
const cf={'גבוהה':90,'בינונית':60,'נמוכה':30},VC={'חזק':'var(--up)','חיובי':'#86efac','ניטרלי':'var(--am)','חלש':'var(--dn)'},NM={'BTC-USD':'BTC','ETH-USD':'ETH'};
const CKA=[['above150','מעל EMA 150'],['cross','EMA 50 מעל 200'],['rsi50','RSI מעל 50'],['above50','מעל EMA 50'],['breakout','פריצה עם נפח']];
const CKB=[['macd','MACD חיובי'],['rs','חזק מ-S&P ב-63 ימים'],['nearHigh','עד 10% משיא שנתי'],['obvUp','OBV עולה'],['calm','תנודתיות נמוכה']];
const H=(id,t,s)=>`<section id="${id}"><h2 class="rv">${t}</h2><p class="sub rv">${s}</p>`;
const gauge=(n,pct,c,t,s,i=0)=>`<div class="card gauge rv" style="--i:${i}"><div class="gw"><svg viewBox="0 0 120 120"><circle class="t" cx="60" cy="60" r="52"/><circle class="v" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7" data-s="${pct}" style="stroke:${c};color:${c}"/></svg><div class="n" data-n="${n}">0</div></div><b style="font-size:19px">${t}</b><span class="mut" style="font-size:13px">${s}</span></div>`;
const normT=t=>String(t||'').toUpperCase().replace(/^BTC$/,'BTC-USD').replace(/^ETH$/,'ETH-USD');
const ul=a=>(a||[]).length?`<ul style="margin:6px 0 12px">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="mut" style="margin:6px 0 12px">–</p>';

const TONE={up:'var(--up)',am:'var(--am)',dn:'var(--dn)'};
function macroTiles(d){const m=d.macro;if(!m?.items?.length)return'';return`<b style="display:block;margin-top:18px">הדוחות הכלכליים האחרונים · ארה"ב</b><div class="mt">${m.items.map(x=>`<a class="mtl" href="#macro"><span>${esc(x.name)}</span><b class="num">${esc(x.value)}</b><small style="color:${TONE[x.tone]}">${esc(x.status)}</small></a>`).join('')}</div>`}
function macroV(d){const m=d.macro;if(!m?.items?.length)return'';
  return H('macro','מצב הדוחות הכלכליים האחרונים בארה"ב','מתעדכן אוטומטית מ-FRED (הפדרל ריזרב של סנט לואיס). הסטטוס והמשמעות נקבעים בכללים קבועים ולא במודל, וזה לא המלצת השקעה')+`<div class="grid">${m.items.map((x,i)=>`<div class="card rv" style="--i:${i%6}"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>${esc(x.name)}</b><span class="chip" style="color:${TONE[x.tone]};border-color:${TONE[x.tone]}">${esc(x.status)}</span></div><div class="num" style="font-size:30px;font-weight:700;margin:6px 0 2px">${esc(x.value)}</div><div class="mut" style="font-size:13px">${esc(x.detail)} · נתון ל-${esc(x.asOf)}</div><span class="lbl">מה זה</span><span style="font-size:14.5px">${esc(x.what)}</span><span class="lbl">מה המשמעות עכשיו</span><span style="font-size:14.5px">${esc(x.impact)}</span></div>`).join('')}</div></section>`}
function hero(d){const a=d.analysis,p=d.prices||{},mo=a?.mood||{},sc=Number.isFinite(+mo.score)?+mo.score:50;
  return`<div class="hero"><div class="card rv"><span class="chip">תמונת מצב מ-${esc(fmt(d.updated))}</span><h1>לאן השוק הולך</h1>${a?`<p style="font-size:17px">${esc(a.summary)}</p><p class="mut">${esc(a.trend)}</p>${a.macroView?`<p>${esc(a.macroView)}</p>`:''}`:`<p class="mut">הניתוח בעברית לא רץ${d.meta?.llmError?': '+esc(d.meta.llmError):''}. הכללים הטכניים והבקרה מוצגים למטה.</p>`}${macroTiles(d)}</div>${a?gauge(sc,sc,col(sc),esc(mo.label||'מצב השוק'),esc(mo.why),2):''}</div>`}

function regime(d){const m=d.market;if(!m)return'';const mk=(r,t,f)=>`<div class="rl ${r.state===true?'t':r.state==null?'n':''}"><span>${esc(r.label)}</span><b class="${r.state==null?'mut':r.state?t:f}">${r.state==null?'לא זמין':r.state?'כן':'לא'}${r.value!=null&&r.state!=null?' · '+esc(r.value):''}</b></div>`,R=m.risk;
  return H('regime','מצב השוק לפי הכללים שלך','אותות קניית דיפים ומגמה. מחירים נכון לסגירה האחרונה ב-'+esc(m.date))+`<div class="hero"><div class="card rv"><b>כללי קניית דיפים · ${m.dip} מתוך 4 פעילים</b><div class="rg">${m.rules.map(r=>mk(r,'am','mut')).join('')}</div><b>מגמה</b><div class="rg" style="margin-bottom:0">${m.trend.map(r=>mk(r,'up','dn')).join('')}</div>${m.conflict?'<p class="am" style="margin:14px 0 0">⚠ סתירה בין הכללים: יש אות דיפ, אבל S&P 500 מתחת ל-EMA 150. כלל המגמה וכלל הדיפים לא מסכימים, והבחירה שלך.</p>':''}<p class="mut" style="margin:12px 0 0;font-size:13px">פחד וחמדנות (CNN): ${m.fng?esc(m.fng.value)+' · '+esc(m.fng.label):'לא זמין'} · קריפטו: ${m.cfng?esc(m.cfng.value)+' · '+esc(m.cfng.label):'לא זמין'}. S5FI ו-McClellan מסומנים "לא זמין" כי אין להם מקור חינמי יציב.</p></div>${gauge(R,R*10,col(100-R*10),'רמת סיכון כללית','מתוך 10, מחושב מ-VIX ומגמת השוק',2)}</div></section>`}

const met=(l,v,c='')=>`<div class="met"><span>${l}</span><b class="num ${c}">${v}</b></div>`;
function controlV(d){const c=d.control;if(!c)return'';const o=(c.open||[])[0],st=c.stats||{n:0,wins:0,avgPnl:0,avgAlpha:0};
  const open=o?`<div class="card rv"><span class="chip">עסקת מעקב פעילה (היפותטית, ללא כסף אמיתי)</span><h3 class="num" style="margin:8px 0 2px;font-size:32px">${esc(o.ticker)} <small class="${cls(o.pnl)}" style="font-size:20px">${sgn(o.pnl)}</small></h3><p class="mut" style="margin:0 0 12px">${esc(o.thesis||'')}</p><div class="mg">${met('כניסה',n2(o.entry)+' · '+esc(o.date))}${met('עכשיו',n2(o.now))}${met('מול S&P 500',sgn(o.alpha),cls(o.alpha))}${met('Stop (ATR×2)',n2(o.stop),'dn')}${met('יעד 2R',n2(o.target),'up')}${met('ציון כניסה',esc(o.entryScore)+'/100')}</div><span class="lbl">יום ${esc(o.days)} מתוך 60</span><div class="bar"><i style="width:${Math.min(100,(o.days||0)/60*100)}%"></i></div></div>`:`<div class="card rv"><b>אין כרגע עסקת מעקב</b><p class="mut">עסקה נפתחת אוטומטית כשיש מניה שעומדת בשני המודלים הטכניים.</p></div>`;

function anim(){const io=new IntersectionObserver(e=>e.forEach(x=>{if(!x.isIntersecting)return;const el=x.target;el.classList.add('on');io.unobserve(el);

function session(){const n=nyNow(),t=trading(n.ds),cl=(EARLY.has(n.ds)?13:16)*3600,pe=(EARLY.has(n.ds)?17:20)*3600;let s,l,tg,k;

 else if(t&&n.sec>=34200&&n.sec<cl){s='open';l='המסחר פתוח';tg='סגירה';k=cl}
 else if(t&&n.sec>=cl&&n.sec<pe){s='post';l='מסחר מאוחר';tg='סיום';k=pe}
 else{s='closed';l=t?'השוק סגור':'סגור (סוף שבוע או חג)';tg='טרום מסחר';let d=t&&n.sec<14400?0:1;while(!trading(addD(n.ds,d)))d++;k=d*86400+14400}
 const L=k-n.sec,dd=Math.floor(L/86400),r=L%86400,p2=x=>String(x).padStart(2,'0');
 return{s,l,tg,txt:(dd?dd+' ימים ':'')+`${p2(Math.floor(r/3600))}:${p2(Math.floor(r%3600/60))}:${p2(r%60)}`}}

  const m=Math.round((Date.now()-new Date(D.updated))/6e4),ago=m<90?m+' דק׳':m<2880?Math.round(m/60)+' שעות':Math.round(m/1440)+' ימים';
  $('#upd').textContent='עודכן '+new Date(D.updated).toLocaleString('he-IL',{timeZone:'America/New_York',dateStyle:'short',timeStyle:'short'})+' ET · לפני '+ago;
  if(lr.ok===false)w=`<div class="warn bad">⚠ ההרצה האחרונה (${esc(fmt(lr.at))}) נדחתה בשער האיכות: ${esc((lr.reasons||[]).join(', '))}. מוצגת תמונת המצב המלאה האחרונה, מלפני ${ago}, בלי ערבוב נתונים חדשים</div>`;
  else if(m>120)w=`<div class="warn bad">⚠ הנתונים לא התעדכנו כבר ${ago}. ההרצה האוטומטית כנראה נעצרה, בדוק ב-GitHub Actions</div>`;
  else if(bad.length)w=`<div class="warn mid">חלק מהמקורות לא זמינים כרגע: ${bad.map(h=>esc(h.name)).join(', ')}. הניתוח מבוסס על המקורות שכן נטענו</div>`;
  $('#warn').innerHTML=w;$('.live i').style.background=lr.ok===false||m>120?'var(--dn)':bad.length?'var(--am)':'var(--up)'}
function tape(d){const h=Object.entries(d.signals||{}).slice(0,16).map(([k,v])=>`<span>${esc({'^VIX':'VIX','BTC-USD':'BTC','ETH-USD':'ETH'}[k]||k)} ${n2(v.price)} <b class="${cls(v.chg)}">${v.chg>=0?'▲':'▼'}${Math.abs(v.chg).toFixed(2)}%</b></span>`).join('');$('#tape').innerHTML=h+h}
function bind(d){const tabs=(sel,fn)=>$(sel)?.querySelectorAll('button').forEach(b=>b.onclick=()=>{$(sel).querySelectorAll('button').forEach(x=>x.classList.remove('a'));b.classList.add('a');fn(b)});
  tabs('#ft',b=>feed(d,b.dataset.t));tabs('#sf',b=>{$('#sg').innerHTML=sgrid(d,b.dataset.f)});feed(d,'news')}
setInterval(tick,1000);tick();setInterval(fresh,30000);
let last='';
async function load(){try{const d=await(await fetch('data.json?'+Date.now())).json();D=d;fresh();
  if(!d.updated){$('#m').innerHTML='<div class="card"><h2>עוד אין נתונים</h2><p class="mut">הרץ את update-data ב-GitHub Actions. אחרי ההרצה הראשונה הדף יתמלא לבד.</p></div>';return}
  tape(d);const sig=d.updated+(d.lastRun?.at||'');if(sig===last)return;last=sig;
  $('#m').innerHTML=view(d);anim();bind(d)
 }catch(e){console.error(e);$('#upd').textContent='אין נתונים עדיין'}}
load();setInterval(load,60000);document.addEventListener('visibilitychange',()=>!document.hidden&&load());
</script>
</body>
